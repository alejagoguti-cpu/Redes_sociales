<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gestor de Contenido - Bitaxus CM</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap">
	<style>
		:root {
			--coral: #ef5b59;
			--ink: #242735;
			--muted: #8b8f9b;
			--line: #f0f1f3;
			--canvas: #f5f6f8;
			--surface: #ffffff;
			--shadow: 0 7px 24px rgba(32, 40, 55, 0.055);
			--success: #1fa774;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'DM Sans', system-ui, sans-serif;
			background: var(--canvas);
			color: var(--ink);
			padding: 2.5rem;
		}

		h1, h2, b, strong {
			font-family: 'Manrope', system-ui, sans-serif;
			letter-spacing: -0.025em;
		}

		.container {
			max-width: 1300px;
			margin: 0 auto;
		}

		header {
			margin-bottom: 3rem;
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 2rem;
			flex-wrap: wrap;
		}

		h1 {
			font-size: 2.2rem;
			font-weight: 800;
			margin-bottom: 0.5rem;
		}

		.subtitle {
			color: var(--muted);
			font-size: 1rem;
			font-weight: 400;
		}

		.nav-link {
			background: var(--surface);
			color: var(--ink);
			padding: 0.75rem 1.5rem;
			border-radius: 9px;
			text-decoration: none;
			font-weight: 600;
			border: 1px solid var(--line);
			box-shadow: var(--shadow);
			transition: all 0.18s cubic-bezier(0.23, 1, 0.32, 1);
		}

		.nav-link:hover {
			border-color: #d9b3b1;
			background: #faf9f8;
			transform: translateY(-2px);
		}

		.layout {
			display: grid;
			grid-template-columns: 1fr 1.3fr;
			gap: 2.5rem;
		}

		.form-section {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 14px;
			padding: 2.5rem;
			height: fit-content;
			position: sticky;
			top: 2rem;
			box-shadow: var(--shadow);
		}

		.form-title {
			font-size: 1.2rem;
			font-weight: 700;
			margin-bottom: 2rem;
		}

		.form-group {
			margin-bottom: 1.75rem;
		}

		label {
			display: block;
			font-weight: 600;
			margin-bottom: 0.6rem;
			font-size: 0.9rem;
			color: var(--ink);
		}

		input, select, textarea {
			width: 100%;
			background: var(--canvas);
			border: 1px solid var(--line);
			color: var(--ink);
			padding: 0.85rem 1rem;
			border-radius: 8px;
			font-family: inherit;
			font-size: 0.95rem;
			transition: all 0.18s ease;
		}

		input::placeholder, textarea::placeholder {
			color: var(--muted);
		}

		input:focus, select:focus, textarea:focus {
			outline: none;
			border-color: var(--coral);
			background: rgba(239, 91, 89, 0.02);
			box-shadow: 0 0 0 3px rgba(239, 91, 89, 0.1);
		}

		textarea {
			resize: vertical;
			min-height: 90px;
		}

		.form-row {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 1.25rem;
		}

		button {
			background: linear-gradient(135deg, var(--coral), #e84c50);
			color: white;
			border: none;
			padding: 1rem;
			border-radius: 9px;
			font-weight: 700;
			cursor: pointer;
			font-family: 'Manrope', system-ui, sans-serif;
			font-size: 0.95rem;
			transition: all 0.18s cubic-bezier(0.23, 1, 0.32, 1);
			width: 100%;
			box-shadow: 0 8px 18px rgba(239, 91, 89, 0.2);
			letter-spacing: -0.01em;
		}

		button:hover {
			background: linear-gradient(135deg, #f06a65, var(--coral));
			box-shadow: 0 12px 28px rgba(239, 91, 89, 0.3);
			transform: translateY(-2px);
		}

		button:active {
			transform: scale(0.98);
		}

		.posts-section {
			display: flex;
			flex-direction: column;
			gap: 2rem;
		}

		.section-header {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 14px;
			padding: 2rem;
			box-shadow: var(--shadow);
		}

		.section-header h2 {
			font-size: 1.3rem;
			font-weight: 700;
			margin-bottom: 0.5rem;
		}

		.posts-count {
			color: var(--muted);
			font-size: 0.9rem;
			font-weight: 500;
		}

		.posts-list {
			display: flex;
			flex-direction: column;
			gap: 1.25rem;
		}

		.post-card {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 10px;
			padding: 1.5rem;
			animation: slideIn 0.35s cubic-bezier(0.23, 1, 0.32, 1);
			transition: all 0.18s ease;
			box-shadow: var(--shadow);
		}

		@keyframes slideIn {
			from { opacity: 0; transform: translateX(-15px); }
			to { opacity: 1; transform: translateX(0); }
		}

		.post-card:hover {
			border-color: #d9b3b1;
			box-shadow: 0 10px 26px rgba(32, 40, 55, 0.08);
			transform: translateY(-2px);
		}

		.post-header {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			margin-bottom: 1rem;
			flex-wrap: wrap;
			gap: 1rem;
		}

		.post-date {
			font-weight: 600;
			font-size: 0.9rem;
			color: var(--muted);
		}

		.post-platform {
			display: inline-block;
			background: linear-gradient(135deg, var(--coral), #e84c50);
			color: white;
			padding: 0.4rem 1rem;
			border-radius: 6px;
			font-size: 0.75rem;
			font-weight: 700;
			letter-spacing: 0.02em;
			box-shadow: 0 4px 12px rgba(239, 91, 89, 0.2);
		}

		.post-title {
			font-weight: 700;
			font-size: 1.05rem;
			margin-bottom: 0.75rem;
			line-height: 1.4;
		}

		.post-meta {
			display: flex;
			gap: 1.25rem;
			flex-wrap: wrap;
			margin-bottom: 1rem;
		}

		.meta-item {
			font-size: 0.85rem;
			color: var(--muted);
			display: flex;
			align-items: center;
			gap: 0.4rem;
			font-weight: 500;
		}

		.post-pillar {
			display: inline-block;
			background: rgba(239, 91, 89, 0.1);
			padding: 0.35rem 0.75rem;
			border-radius: 6px;
			font-size: 0.75rem;
			color: var(--muted);
			font-weight: 600;
			border: 0.5px solid rgba(239, 91, 89, 0.15);
		}

		.post-actions {
			display: flex;
			gap: 0.75rem;
			margin-top: 1.25rem;
		}

		.btn-small {
			padding: 0.5rem 1rem;
			font-size: 0.8rem;
			background: var(--canvas);
			color: var(--ink);
			border: 1px solid var(--line);
			border-radius: 6px;
			cursor: pointer;
			transition: all 0.18s ease;
			flex: 1;
			font-weight: 600;
		}

		.btn-small:hover {
			border-color: var(--coral);
			background: rgba(239, 91, 89, 0.02);
			color: var(--coral);
		}

		.empty-state {
			text-align: center;
			padding: 4rem 2rem;
			color: var(--muted);
		}

		.empty-state-icon {
			font-size: 3.5rem;
			margin-bottom: 1rem;
			opacity: 0.4;
		}

		.stats-grid {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 1rem;
			margin-top: 2rem;
		}

		.stat {
			background: var(--canvas);
			padding: 1.25rem;
			border-radius: 10px;
			text-align: center;
			border: 1px solid var(--line);
		}

		.stat-value {
			font-size: 1.75rem;
			font-weight: 800;
			color: var(--coral);
		}

		.stat-label {
			font-size: 0.8rem;
			color: var(--muted);
			margin-top: 0.5rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.success-message {
			background: linear-gradient(135deg, rgba(31, 167, 116, 0.1), rgba(31, 167, 116, 0.05));
			border: 1px solid var(--success);
			color: var(--success);
			padding: 1.25rem;
			border-radius: 8px;
			margin-bottom: 1.5rem;
			display: none;
			animation: slideIn 0.3s ease-out;
			font-weight: 600;
		}

		.success-message.show {
			display: block;
		}

		@media (max-width: 1024px) {
			.layout { grid-template-columns: 1fr; }
			.form-section { position: static; }
		}

		@media (max-width: 768px) {
			body { padding: 1.5rem; }
			h1 { font-size: 1.8rem; }
			header { flex-direction: column; }
			.form-row { grid-template-columns: 1fr; }
			.stats-grid { grid-template-columns: repeat(2, 1fr); }
		}
	</style>
</head>
<body>
	<div class="container">
		<header>
			<img src="../logo-black.png" alt="Bitaxus" style="width: 100px; height: auto; margin-bottom: 1rem;">
			<div>
				<img src="../logo-black.png" alt="Bitaxus" style="width: 100px; height: auto; margin-bottom: 1rem;">
				<h1>Gestor de Contenido</h1>
				<p class="subtitle">Agrega y gestiona posts para Q1 2025</p>
			</div>
			<a href="interactive-calendar.html" class="nav-link">📅 Ver Calendario</a>
		</header>

		<div class="layout">
			<div class="form-section">
				<div class="form-title">➕ Agregar Nuevo Post</div>
				<div class="success-message" id="successMsg">✓ Post agregado exitosamente</div>
				<form id="postForm" onsubmit="handleSubmit(event)">
					<div class="form-group">
						<label>Fecha</label>
						<input type="date" id="date" required>
					</div>
					<div class="form-row">
						<div class="form-group">
							<label>Plataforma</label>
							<select id="platform" required>
								<option value="">Selecciona</option>
								<option value="LinkedIn">LinkedIn</option>
								<option value="Instagram">Instagram</option>
								<option value="Twitter">Twitter</option>
								<option value="Newsletter">Newsletter</option>
							</select>
						</div>
						<div class="form-group">
							<label>Hora</label>
							<input type="time" id="time" required>
						</div>
					</div>
					<div class="form-group">
						<label>Pilar</label>
						<select id="pillar" required>
							<option value="">Selecciona</option>
							<option value="Money Movement">Money Movement</option>
							<option value="Security & Trust">Security & Trust</option>
							<option value="Business Decisions">Business Decisions</option>
							<option value="Real Stories">Real Stories</option>
						</select>
					</div>
					<div class="form-group">
						<label>Título</label>
						<input type="text" id="title" placeholder="Tema del post" required>
					</div>
					<div class="form-group">
						<label>Descripción (opcional)</label>
						<textarea id="description" placeholder="Detalles adicionales..."></textarea>
					</div>
					<button type="submit">Agregar Post</button>
				</form>
				<div class="stats-grid">
					<div class="stat">
						<div class="stat-value" id="totalCount">0</div>
						<div class="stat-label">Total Posts</div>
					</div>
					<div class="stat">
						<div class="stat-value" id="platformCount">0</div>
						<div class="stat-label">Plataformas</div>
					</div>
				</div>
			</div>

			<div class="posts-section">
				<div class="section-header">
					<h2>Posts Agregados</h2>
					<p class="posts-count" id="postsCountText">0 posts</p>
				</div>
				<div class="posts-list" id="postsList">
					<div class="empty-state">
						<div class="empty-state-icon">📝</div>
						<p>No hay posts todavía. ¡Agrega el primero!</p>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		let posts = JSON.parse(localStorage.getItem('bitaxusPosts')) || [];
		document.getElementById('date').valueAsDate = new Date();

		function handleSubmit(event) {
			event.preventDefault();
			const newPost = {
				id: Date.now(),
				date: document.getElementById('date').value,
				platform: document.getElementById('platform').value,
				time: document.getElementById('time').value,
				pillar: document.getElementById('pillar').value,
				title: document.getElementById('title').value,
				description: document.getElementById('description').value,
			};
			posts.unshift(newPost);
			localStorage.setItem('bitaxusPosts', JSON.stringify(posts));
			const successMsg = document.getElementById('successMsg');
			successMsg.classList.add('show');
			setTimeout(() => successMsg.classList.remove('show'), 3000);
			document.getElementById('postForm').reset();
			document.getElementById('date').valueAsDate = new Date();
			renderPosts();
			updateStats();
		}

		function deletePost(id) {
			posts = posts.filter(p => p.id !== id);
			localStorage.setItem('bitaxusPosts', JSON.stringify(posts));
			renderPosts();
			updateStats();
		}

		function editPost(id) {
			const post = posts.find(p => p.id === id);
			if (post) {
				document.getElementById('date').value = post.date;
				document.getElementById('platform').value = post.platform;
				document.getElementById('time').value = post.time;
				document.getElementById('pillar').value = post.pillar;
				document.getElementById('title').value = post.title;
				document.getElementById('description').value = post.description || '';
				deletePost(id);
				window.scrollTo({ top: 0, behavior: 'smooth' });
			}
		}

		function renderPosts() {
			const postsList = document.getElementById('postsList');
			if (posts.length === 0) {
				postsList.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📝</div><p>No hay posts todavía. ¡Agrega el primero!</p></div>`;
				return;
			}
			postsList.innerHTML = posts.map(post => `
				<div class="post-card">
					<div class="post-header">
						<div class="post-date">${formatDate(post.date)}</div>
						<div class="post-platform">${post.platform}</div>
					</div>
					<div class="post-title">${post.title}</div>
					<div class="post-meta">
						<div class="meta-item">🕐 ${post.time}</div>
						<div class="post-pillar">${post.pillar}</div>
					</div>
					${post.description ? `<div style="color: var(--muted); font-size: 0.9rem; margin-bottom: 0.75rem;">${post.description}</div>` : ''}
					<div class="post-actions">
						<button class="btn-small" onclick="editPost(${post.id})">Editar</button>
						<button class="btn-small" onclick="deletePost(${post.id})">Eliminar</button>
					</div>
				</div>
			`).join('');
		}

		function updateStats() {
			document.getElementById('totalCount').textContent = posts.length;
			document.getElementById('postsCountText').textContent = posts.length === 0 ? '0 posts' : posts.length === 1 ? '1 post' : `${posts.length} posts`;
			const platforms = new Set(posts.map(p => p.platform));
			document.getElementById('platformCount').textContent = platforms.size;
		}

		renderPosts();
		updateStats();

		window.addEventListener('storage', () => {
			posts = JSON.parse(localStorage.getItem('bitaxusPosts')) || [];
			renderPosts();
			updateStats();
		});
	</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gestor de Contenido - Bitaxus CM</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
	<style>
		:root {
			--red: #D1232E;
			--dark: #0A0A1A;
			--card: #1A1A2E;
			--card-light: #252542;
			--border: #2D2D44;
			--border-light: #3D3D5C;
			--text: #E5E5E5;
			--text-secondary: #B0B0B8;
			--gray: #808088;
			--success: #10b981;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html {
			scroll-behavior: smooth;
		}

		body {
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			background: var(--dark);
			color: var(--text);
			padding: 2.5rem;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
		}

		.container {
			max-width: 1300px;
			margin: 0 auto;
		}

		header {
			margin-bottom: 3.5rem;
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			gap: 2rem;
			flex-wrap: wrap;
		}

		h1 {
			font-size: 2.8rem;
			font-weight: 800;
			margin-bottom: 0.5rem;
			letter-spacing: -0.02em;
		}

		.subtitle {
			color: var(--text-secondary);
			font-size: 1.05rem;
			font-weight: 400;
		}

		.layout {
			display: grid;
			grid-template-columns: 1fr 1.3fr;
			gap: 2.5rem;
		}

		/* Form Section */
		.form-section {
			background: linear-gradient(135deg, var(--card) 0%, var(--card-light) 100%);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 2.5rem;
			height: fit-content;
			position: sticky;
			top: 2rem;
		}

		.form-section::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			height: 1px;
			background: linear-gradient(90deg, transparent, rgba(209, 35, 46, 0.3), transparent);
			border-radius: 12px 12px 0 0;
		}

		.form-title {
			font-size: 1.35rem;
			font-weight: 700;
			margin-bottom: 2rem;
			display: flex;
			align-items: center;
			gap: 0.75rem;
			letter-spacing: -0.01em;
		}

		.form-group {
			margin-bottom: 1.75rem;
		}

		label {
			display: block;
			font-weight: 600;
			margin-bottom: 0.6rem;
			font-size: 0.9rem;
			color: var(--text);
			letter-spacing: 0.01em;
		}

		input, select, textarea {
			width: 100%;
			background: rgba(255, 255, 255, 0.04);
			border: 1.5px solid var(--border);
			color: var(--text);
			padding: 0.85rem 1rem;
			border-radius: 8px;
			font-family: inherit;
			font-size: 0.95rem;
			transition: all 0.25s ease;
		}

		input::placeholder, textarea::placeholder {
			color: var(--gray);
		}

		input:focus, select:focus, textarea:focus {
			outline: none;
			border-color: var(--red);
			background: rgba(209, 35, 46, 0.08);
			box-shadow: 0 0 0 3px rgba(209, 35, 46, 0.15);
		}

		textarea {
			resize: vertical;
			min-height: 90px;
		}

		.form-row {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 1.25rem;
		}

		button {
			background: linear-gradient(135deg, var(--red) 0%, #c41d25 100%);
			color: white;
			border: none;
			padding: 1rem;
			border-radius: 8px;
			font-weight: 700;
			cursor: pointer;
			font-family: inherit;
			font-size: 1rem;
			transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
			width: 100%;
			letter-spacing: 0.01em;
			box-shadow: 0 4px 15px rgba(209, 35, 46, 0.25);
		}

		button:hover {
			background: linear-gradient(135deg, #c41d25 0%, #a81a21 100%);
			transform: translateY(-3px);
			box-shadow: 0 8px 25px rgba(209, 35, 46, 0.35);
		}

		button:active {
			transform: translateY(-1px);
		}

		/* Posts List */
		.posts-section {
			display: flex;
			flex-direction: column;
			gap: 2rem;
		}

		.section-header {
			background: linear-gradient(135deg, var(--card) 0%, var(--card-light) 100%);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 2rem;
		}

		.section-header::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			height: 1px;
			background: linear-gradient(90deg, transparent, rgba(209, 35, 46, 0.3), transparent);
		}

		.section-header h2 {
			font-size: 1.5rem;
			font-weight: 700;
			margin-bottom: 0.5rem;
			letter-spacing: -0.01em;
		}

		.posts-count {
			color: var(--text-secondary);
			font-size: 0.9rem;
			font-weight: 500;
		}

		.posts-list {
			display: flex;
			flex-direction: column;
			gap: 1.25rem;
		}

		.post-card {
			background: linear-gradient(135deg, var(--card) 0%, rgba(37, 37, 66, 0.5) 100%);
			border: 1px solid var(--border);
			border-radius: 10px;
			padding: 1.5rem;
			animation: slideIn 0.35s ease-out;
			transition: all 0.25s ease;
			position: relative;
			overflow: hidden;
		}

		.post-card::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			height: 1px;
			background: linear-gradient(90deg, transparent, rgba(209, 35, 46, 0.2), transparent);
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateX(-20px);
			}
			to {
				opacity: 1;
				transform: translateX(0);
			}
		}

		.post-card:hover {
			border-color: var(--red);
			background: linear-gradient(135deg, var(--card) 0%, rgba(37, 37, 66, 0.7) 100%);
			box-shadow: 0 8px 24px rgba(209, 35, 46, 0.15);
			transform: translateY(-2px);
		}

		.post-header {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			margin-bottom: 1rem;
			flex-wrap: wrap;
			gap: 1rem;
		}

		.post-date {
			font-weight: 600;
			font-size: 0.9rem;
			color: var(--text-secondary);
		}

		.post-platform {
			display: inline-block;
			background: linear-gradient(135deg, var(--red) 0%, #c41d25 100%);
			color: white;
			padding: 0.4rem 0.9rem;
			border-radius: 6px;
			font-size: 0.75rem;
			font-weight: 700;
			letter-spacing: 0.02em;
			box-shadow: 0 2px 8px rgba(209, 35, 46, 0.3);
		}

		.post-title {
			font-weight: 700;
			font-size: 1.05rem;
			margin-bottom: 0.75rem;
			line-height: 1.4;
			letter-spacing: -0.01em;
		}

		.post-meta {
			display: flex;
			gap: 1.25rem;
			flex-wrap: wrap;
			margin-bottom: 1rem;
		}

		.meta-item {
			font-size: 0.85rem;
			color: var(--text-secondary);
			display: flex;
			align-items: center;
			gap: 0.4rem;
			font-weight: 500;
		}

		.post-pillar {
			display: inline-block;
			background: rgba(209, 35, 46, 0.1);
			padding: 0.35rem 0.75rem;
			border-radius: 6px;
			font-size: 0.75rem;
			color: var(--text-secondary);
			font-weight: 600;
			border: 0.5px solid rgba(209, 35, 46, 0.2);
		}

		.post-actions {
			display: flex;
			gap: 0.75rem;
			margin-top: 1.25rem;
		}

		.btn-small {
			padding: 0.5rem 1rem;
			font-size: 0.8rem;
			background: var(--border);
			color: var(--text);
			border: none;
			border-radius: 6px;
			cursor: pointer;
			transition: all 0.2s ease;
			flex: 1;
			font-weight: 600;
		}

		.btn-small:hover {
			background: var(--red);
			box-shadow: 0 4px 12px rgba(209, 35, 46, 0.3);
		}

		.empty-state {
			text-align: center;
			padding: 4rem 2rem;
			color: var(--text-secondary);
		}

		.empty-state-icon {
			font-size: 3.5rem;
			margin-bottom: 1rem;
			opacity: 0.4;
		}

		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
			gap: 1rem;
			margin-top: 2rem;
		}

		.stat {
			background: linear-gradient(135deg, rgba(209, 35, 46, 0.1) 0%, rgba(209, 35, 46, 0.05) 100%);
			padding: 1.25rem;
			border-radius: 10px;
			text-align: center;
			border: 1px solid rgba(209, 35, 46, 0.15);
		}

		.stat-value {
			font-size: 1.75rem;
			font-weight: 800;
			color: var(--red);
			letter-spacing: -0.02em;
		}

		.stat-label {
			font-size: 0.8rem;
			color: var(--text-secondary);
			margin-top: 0.5rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}

		.success-message {
			background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0.06) 100%);
			border: 1.5px solid var(--success);
			color: var(--success);
			padding: 1.25rem;
			border-radius: 8px;
			margin-bottom: 1.5rem;
			display: none;
			animation: slideIn 0.3s ease-out;
			font-weight: 600;
		}

		.success-message.show {
			display: block;
		}

		@media (max-width: 1024px) {
			.layout {
				grid-template-columns: 1fr;
			}
		}

		@media (max-width: 768px) {
			body {
				padding: 1rem;
			}

			h1 {
				font-size: 1.8rem;
			}

			.form-row {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<header style="display: flex; justify-content: space-between; align-items: flex-start; gap: 2rem; flex-wrap: wrap;">
			<div>
				<h1>Gestor de Contenido</h1>
				<p class="subtitle">Agrega y gestiona posts de Q1 2025</p>
			</div>
			<a href="interactive-calendar.html" style="align-self: center; background: var(--border); color: var(--text); padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; transition: all 0.2s ease;"
				onmouseover="this.style.background='var(--red)'"
				onmouseout="this.style.background='var(--border)'">
				📅 Ver en Calendario
			</a>
		</header>

		<div class="layout">
			<!-- Form -->
			<div class="form-section">
				<div class="form-title">➕ Nuevo Post</div>

				<div class="success-message" id="successMsg">✓ Post agregado exitosamente</div>

				<form id="postForm" onsubmit="handleSubmit(event)">
					<div class="form-group">
						<label>Fecha</label>
						<input type="date" id="date" required>
					</div>

					<div class="form-row">
						<div class="form-group">
							<label>Plataforma</label>
							<select id="platform" required>
								<option value="">Selecciona plataforma</option>
								<option value="LinkedIn">LinkedIn</option>
								<option value="Instagram">Instagram</option>
								<option value="Twitter">Twitter</option>
								<option value="Newsletter">Newsletter</option>
							</select>
						</div>
						<div class="form-group">
							<label>Hora (HH:MM)</label>
							<input type="time" id="time" required>
						</div>
					</div>

					<div class="form-group">
						<label>Pilar / Categoría</label>
						<select id="pillar" required>
							<option value="">Selecciona pilar</option>
							<option value="Money Movement">Money Movement</option>
							<option value="Security & Trust">Security & Trust</option>
							<option value="Business Decisions">Business Decisions</option>
							<option value="Real Stories">Real Stories</option>
						</select>
					</div>

					<div class="form-group">
						<label>Título / Tema</label>
						<input type="text" id="title" placeholder="Ej: Tips de seguridad en crypto" required>
					</div>

					<div class="form-group">
						<label>Descripción (opcional)</label>
						<textarea id="description" placeholder="Detalles adicionales del post..."></textarea>
					</div>

					<button type="submit">Agregar Post</button>
				</form>

				<div class="stats-grid">
					<div class="stat">
						<div class="stat-value" id="totalCount">0</div>
						<div class="stat-label">Total Posts</div>
					</div>
					<div class="stat">
						<div class="stat-value" id="platformCount">0</div>
						<div class="stat-label">Plataformas</div>
					</div>
				</div>
			</div>

			<!-- Posts List -->
			<div class="posts-section">
				<div class="section-header">
					<h2>Posts Agregados</h2>
					<p class="posts-count" id="postsCountText">0 posts agregados</p>
				</div>

				<div class="posts-list" id="postsList">
					<div class="empty-state">
						<div class="empty-state-icon">📝</div>
						<p>No hay posts todavía. ¡Agrega el primero!</p>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script>
		// Load from localStorage on page load
		let posts = JSON.parse(localStorage.getItem('bitaxusPosts')) || [];

		// Set today's date as default
		document.getElementById('date').valueAsDate = new Date();

		function handleSubmit(event) {
			event.preventDefault();

			const newPost = {
				id: Date.now(),
				date: document.getElementById('date').value,
				platform: document.getElementById('platform').value,
				time: document.getElementById('time').value,
				pillar: document.getElementById('pillar').value,
				title: document.getElementById('title').value,
				description: document.getElementById('description').value,
			};

			posts.unshift(newPost); // Add to beginning
			localStorage.setItem('bitaxusPosts', JSON.stringify(posts));

			// Show success message
			const successMsg = document.getElementById('successMsg');
			successMsg.classList.add('show');
			setTimeout(() => successMsg.classList.remove('show'), 3000);

			// Reset form
			document.getElementById('postForm').reset();
			document.getElementById('date').valueAsDate = new Date();

			// Update display
			renderPosts();
			updateStats();
		}

		function deletePost(id) {
			posts = posts.filter(p => p.id !== id);
			localStorage.setItem('bitaxusPosts', JSON.stringify(posts));
			renderPosts();
			updateStats();
		}

		function editPost(id) {
			const post = posts.find(p => p.id === id);
			if (post) {
				document.getElementById('date').value = post.date;
				document.getElementById('platform').value = post.platform;
				document.getElementById('time').value = post.time;
				document.getElementById('pillar').value = post.pillar;
				document.getElementById('title').value = post.title;
				document.getElementById('description').value = post.description || '';

				deletePost(id);
				window.scrollTo({ top: 0, behavior: 'smooth' });
			}
		}

		function renderPosts() {
			const postsList = document.getElementById('postsList');

			if (posts.length === 0) {
				postsList.innerHTML = `
					<div class="empty-state">
						<div class="empty-state-icon">📝</div>
						<p>No hay posts todavía. ¡Agrega el primero!</p>
					</div>
				`;
				return;
			}

			postsList.innerHTML = posts.map(post => `
				<div class="post-card">
					<div class="post-header">
						<div class="post-date">${formatDate(post.date)}</div>
						<div class="post-platform">${post.platform}</div>
					</div>
					<div class="post-title">${post.title}</div>
					<div class="post-meta">
						<div class="meta-item">🕐 ${post.time}</div>
						<div class="post-pillar">${post.pillar}</div>
					</div>
					${post.description ? `<div style="color: var(--gray); font-size: 0.9rem; margin-bottom: 0.75rem;">${post.description}</div>` : ''}
					<div class="post-actions">
						<button class="btn-small" onclick="editPost(${post.id})">Editar</button>
						<button class="btn-small" onclick="deletePost(${post.id})">Eliminar</button>
					</div>
				</div>
			`).join('');
		}

		function updateStats() {
			document.getElementById('totalCount').textContent = posts.length;
			document.getElementById('postsCountText').textContent =
				posts.length === 0 ? '0 posts agregados' :
				posts.length === 1 ? '1 post agregado' :
				`${posts.length} posts agregados`;

			const platforms = new Set(posts.map(p => p.platform));
			document.getElementById('platformCount').textContent = platforms.size;
		}

		function formatDate(dateStr) {
			const date = new Date(dateStr + 'T00:00:00');
			return new Intl.DateTimeFormat('es-ES', {
				weekday: 'short',
				month: 'short',
				day: 'numeric'
			}).format(date);
		}

		// Initial render
		renderPosts();
		updateStats();

		// Auto-save every 5 seconds (backup)
		setInterval(() => {
			localStorage.setItem('bitaxusPosts', JSON.stringify(posts));
		}, 5000);
	</script>
</body>
</html>

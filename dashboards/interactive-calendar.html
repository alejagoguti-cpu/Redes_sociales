<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calendario Interactivo - Bitaxus CM</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
	<style>
		:root {
			--red: #D1232E;
			--dark: #0A0A1A;
			--card: #1A1A2E;
			--card-light: #252542;
			--border: #2D2D44;
			--border-light: #3D3D5C;
			--text: #E5E5E5;
			--text-secondary: #B0B0B8;
			--gray: #808088;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html {
			scroll-behavior: smooth;
		}

		body {
			font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			background: var(--dark);
			color: var(--text);
			padding: 2.5rem;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale;
		}

		.container {
			max-width: 1100px;
			margin: 0 auto;
		}

		header {
			margin-bottom: 3.5rem;
		}

		h1 {
			font-size: 2.8rem;
			font-weight: 800;
			margin-bottom: 0.5rem;
			color: #fff;
			letter-spacing: -0.02em;
		}

		.subtitle {
			color: var(--text-secondary);
			font-size: 1.05rem;
			font-weight: 400;
		}

		.calendar-controls {
			display: flex;
			gap: 1.5rem;
			margin-bottom: 2.5rem;
			justify-content: space-between;
			align-items: center;
			flex-wrap: wrap;
		}

		.month-nav {
			display: flex;
			gap: 0.75rem;
			align-items: center;
		}

		button {
			background: linear-gradient(135deg, var(--card) 0%, var(--card-light) 100%);
			border: 1px solid var(--border);
			color: var(--text);
			padding: 0.85rem 1.5rem;
			border-radius: 8px;
			cursor: pointer;
			font-family: inherit;
			font-weight: 600;
			transition: all 0.25s ease;
			font-size: 0.95rem;
		}

		button:hover {
			border-color: var(--red);
			background: linear-gradient(135deg, rgba(209, 35, 46, 0.1) 0%, rgba(209, 35, 46, 0.05) 100%);
			box-shadow: 0 4px 12px rgba(209, 35, 46, 0.2);
		}

		.month-title {
			font-size: 1.35rem;
			font-weight: 700;
			min-width: 160px;
			text-align: center;
			letter-spacing: -0.01em;
		}

		.calendar {
			background: linear-gradient(135deg, var(--card) 0%, var(--card-light) 100%);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 2.5rem;
			margin-bottom: 2.5rem;
		}

		.calendar::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			right: 0;
			height: 1px;
			background: linear-gradient(90deg, transparent, rgba(209, 35, 46, 0.3), transparent);
			border-radius: 12px 12px 0 0;
		}

		.weekdays {
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			gap: 1rem;
			margin-bottom: 1rem;
		}

		.weekday-header {
			text-align: center;
			font-weight: 700;
			color: var(--text-secondary);
			font-size: 0.85rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			padding: 0.75rem;
		}

		.days {
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			gap: 1rem;
		}

		.day {
			aspect-ratio: 1;
			border: 1.5px solid var(--border);
			border-radius: 10px;
			padding: 0.85rem;
			cursor: pointer;
			transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
			display: flex;
			flex-direction: column;
			position: relative;
			min-height: 85px;
			background: rgba(255, 255, 255, 0.02);
		}

		.day::before {
			content: '';
			position: absolute;
			inset: 0;
			border-radius: 10px;
			background: linear-gradient(135deg, transparent 0%, rgba(209, 35, 46, 0.02) 100%);
			pointer-events: none;
		}

		.day:hover {
			border-color: var(--red);
			background: rgba(209, 35, 46, 0.1);
			box-shadow: 0 4px 16px rgba(209, 35, 46, 0.15);
			transform: translateY(-2px);
		}

		.day.other-month {
			opacity: 0.25;
			cursor: default;
		}

		.day.other-month:hover {
			border-color: var(--border);
			background: transparent;
			box-shadow: none;
			transform: none;
		}

		.day.has-posts {
			border-color: var(--red);
			background: rgba(209, 35, 46, 0.12);
			box-shadow: inset 0 0 20px rgba(209, 35, 46, 0.1);
		}

		.day.has-posts:hover {
			box-shadow: 0 4px 16px rgba(209, 35, 46, 0.25), inset 0 0 20px rgba(209, 35, 46, 0.1);
		}

		.day-number {
			font-weight: 800;
			font-size: 1rem;
			margin-bottom: 0.6rem;
			letter-spacing: -0.01em;
		}

		.post-count {
			font-size: 0.7rem;
			background: linear-gradient(135deg, var(--red) 0%, #c41d25 100%);
			color: white;
			padding: 0.3rem 0.5rem;
			border-radius: 4px;
			display: inline-block;
			font-weight: 700;
			letter-spacing: 0.02em;
			box-shadow: 0 2px 6px rgba(209, 35, 46, 0.3);
		}

		.day-posts {
			font-size: 0.7rem;
			color: var(--gray);
			margin-top: auto;
			padding-top: 0.5rem;
			border-top: 1px solid var(--border);
			max-height: 30px;
			overflow: hidden;
		}

		.day-posts span {
			display: block;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.details-panel {
			background: linear-gradient(135deg, var(--card) 0%, var(--card-light) 100%);
			border: 1px solid var(--border);
			border-radius: 12px;
			padding: 2.5rem;
			display: none;
			animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
		}

		.details-panel.active {
			display: block;
		}

		@keyframes slideIn {
			from {
				opacity: 0;
				transform: translateY(15px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.panel-title {
			font-size: 1.4rem;
			font-weight: 700;
			margin-bottom: 1.75rem;
			display: flex;
			align-items: center;
			gap: 0.75rem;
			letter-spacing: -0.01em;
		}

		.close-btn {
			margin-left: auto;
			background: var(--border);
			border: 1px solid var(--border-light);
			width: 36px;
			height: 36px;
			border-radius: 8px;
			cursor: pointer;
			font-size: 1.2rem;
			transition: all 0.2s ease;
		}

		.close-btn:hover {
			background: rgba(209, 35, 46, 0.1);
			border-color: var(--red);
		}

		.posts-list {
			display: flex;
			flex-direction: column;
			gap: 1.5rem;
		}

		.post-item {
			border-left: 3px solid var(--red);
			padding: 1.25rem;
			background: rgba(209, 35, 46, 0.08);
			border-radius: 8px;
			transition: all 0.2s ease;
		}

		.post-item:hover {
			background: rgba(209, 35, 46, 0.12);
			box-shadow: 0 2px 8px rgba(209, 35, 46, 0.15);
		}

		.post-platform {
			display: inline-block;
			background: linear-gradient(135deg, var(--red) 0%, #c41d25 100%);
			color: white;
			padding: 0.35rem 0.85rem;
			border-radius: 6px;
			font-size: 0.8rem;
			font-weight: 700;
			margin-bottom: 0.75rem;
			letter-spacing: 0.02em;
			box-shadow: 0 2px 6px rgba(209, 35, 46, 0.3);
		}

		.post-time {
			color: var(--text-secondary);
			font-size: 0.9rem;
			margin-bottom: 0.75rem;
			font-weight: 500;
		}

		.post-title {
			font-weight: 700;
			margin-bottom: 0.75rem;
			letter-spacing: -0.01em;
		}

		.post-pillar {
			display: inline-block;
			background: rgba(209, 35, 46, 0.1);
			padding: 0.35rem 0.85rem;
			border-radius: 6px;
			font-size: 0.75rem;
			color: var(--text-secondary);
			font-weight: 600;
			border: 0.5px solid rgba(209, 35, 46, 0.2);
		}

		.stats {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 1.5rem;
			margin-bottom: 3.5rem;
		}

		.stat-card {
			background: linear-gradient(135deg, rgba(209, 35, 46, 0.1) 0%, rgba(209, 35, 46, 0.05) 100%);
			border: 1.5px solid var(--border);
			padding: 1.75rem 1.5rem;
			border-radius: 10px;
			text-align: center;
			transition: all 0.2s ease;
		}

		.stat-card:hover {
			border-color: var(--red);
			box-shadow: 0 4px 12px rgba(209, 35, 46, 0.15);
		}

		.stat-value {
			font-size: 2.2rem;
			font-weight: 800;
			color: var(--red);
			letter-spacing: -0.02em;
		}

		.stat-label {
			color: var(--text-secondary);
			font-size: 0.85rem;
			margin-top: 0.75rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			font-weight: 600;
		}

		@media (max-width: 768px) {
			body {
				padding: 1rem;
			}

			h1 {
				font-size: 1.8rem;
			}

			.day {
				min-height: 70px;
				padding: 0.5rem;
			}

			.weekdays, .days {
				gap: 0.5rem;
			}

			.calendar {
				padding: 1rem;
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<header>
			<h1>Calendario Q1 2025</h1>
			<p class="subtitle">Visualiza todos los posts programados para el trimestre</p>
		</header>

		<div class="stats">
			<div class="stat-card">
				<div class="stat-value" id="totalPosts">0</div>
				<div class="stat-label">Posts Totales</div>
			</div>
			<div class="stat-card">
				<div class="stat-value" id="totalBlogs">0</div>
				<div class="stat-label">Blog Posts</div>
			</div>
			<div class="stat-card">
				<div class="stat-value" id="postsPerWeek">0</div>
				<div class="stat-label">Posts/Semana</div>
			</div>
			<div class="stat-card">
				<div class="stat-value" id="platformCount">0</div>
				<div class="stat-label">Plataformas</div>
			</div>
		</div>

		<div class="calendar-controls">
			<div class="month-nav">
				<button onclick="previousMonth()">← Anterior</button>
				<div class="month-title" id="monthTitle">Enero 2025</div>
				<button onclick="nextMonth()">Siguiente →</button>
			</div>
			<button onclick="refreshCalendar()" style="background: var(--border); border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; color: var(--text); font-weight: 600;">🔄 Refrescar</button>
		</div>

		<div class="calendar">
			<div class="weekdays">
				<div class="weekday-header">Dom</div>
				<div class="weekday-header">Lun</div>
				<div class="weekday-header">Mar</div>
				<div class="weekday-header">Mié</div>
				<div class="weekday-header">Jue</div>
				<div class="weekday-header">Vie</div>
				<div class="weekday-header">Sab</div>
			</div>
			<div class="days" id="daysContainer"></div>
		</div>

		<div class="details-panel" id="detailsPanel">
			<div class="panel-title">
				<span id="panelDate"></span>
				<button class="close-btn" onclick="closeDetails()">×</button>
			</div>
			<div class="posts-list" id="postsList"></div>
		</div>
	</div>

	<script>
		let calendarData = {};
		let customPosts = []; // Posts del Content Manager
		let currentMonth = 0; // 0 = Enero, 1 = Febrero, 2 = Marzo
		const months = ['Enero', 'Febrero', 'Marzo'];
		const monthDays = [31, 28, 31];
		const startYear = 2025;

		async function loadCalendar() {
			try {
				const response = await fetch('../calendar.json');
				calendarData = await response.json();
				loadCustomPosts();
				renderCalendar();
				updateStats();
			} catch (error) {
				console.error('Error loading calendar:', error);
			}
		}

		function loadCustomPosts() {
			customPosts = JSON.parse(localStorage.getItem('bitaxusPosts')) || [];
		}

		// Listen for changes in localStorage (from Content Manager in another tab/window)
		window.addEventListener('storage', (e) => {
			if (e.key === 'bitaxusPosts') {
				loadCustomPosts();
				renderCalendar();
				updateStats();
			}
		});

		function renderCalendar() {
			const container = document.getElementById('daysContainer');
			container.innerHTML = '';

			const year = startYear;
			const month = currentMonth;
			const firstDay = new Date(year, month, 1).getDay();
			const daysInMonth = monthDays[month];

			// Días del mes anterior
			const prevMonthDays = monthDays[month === 0 ? 2 : month - 1];
			for (let i = prevMonthDays - firstDay + 1; i <= prevMonthDays; i++) {
				const dayEl = createDayElement(i, true);
				container.appendChild(dayEl);
			}

			// Días del mes actual
			for (let i = 1; i <= daysInMonth; i++) {
				const dayEl = createDayElement(i, false);
				container.appendChild(dayEl);
			}

			// Días del mes siguiente
			const totalCells = container.children.length;
			const remainingCells = 42 - totalCells; // 6 filas × 7 días
			for (let i = 1; i <= remainingCells; i++) {
				const dayEl = createDayElement(i, true);
				container.appendChild(dayEl);
			}

			updateMonthTitle();
		}

		function createDayElement(day, isOtherMonth) {
			const el = document.createElement('div');
			el.className = 'day';
			if (isOtherMonth) el.classList.add('other-month');

			if (!isOtherMonth) {
				const dateStr = formatDate(day, currentMonth);
				const postsOnDay = getPostsForDate(dateStr);

				if (postsOnDay.length > 0) {
					el.classList.add('has-posts');
					el.style.cursor = 'pointer';
					el.addEventListener('click', () => showDetails(day, postsOnDay));
				}

				el.innerHTML = `
					<div class="day-number">${day}</div>
					${postsOnDay.length > 0 ? `<div class="post-count">${postsOnDay.length}</div>` : ''}
					${postsOnDay.length > 0 ? `<div class="day-posts">${postsOnDay.map(p => `<span>${getPlatformEmoji(p.platform)}</span>`).join('')}</div>` : ''}
				`;
			} else {
				el.innerHTML = `<div class="day-number">${day}</div>`;
			}

			return el;
		}

		function formatDate(day, month) {
			return `2025-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
		}

		function getPostsForDate(dateStr) {
			const posts = [];

			// Posts from calendar.json
			calendarData.weeks?.forEach(week => {
				week.posts?.forEach(post => {
					if (post.date === dateStr) {
						posts.push(post);
					}
				});
			});

			// Posts from Content Manager (localStorage)
			customPosts.forEach(post => {
				if (post.date === dateStr) {
					posts.push({
						platform: post.platform,
						time: post.time,
						title: post.title,
						pillar: post.pillar,
						description: post.description,
						isCustom: true
					});
				}
			});

			return posts;
		}

		function getPlatformEmoji(platform) {
			const map = {
				'LinkedIn': 'in',
				'Instagram': 'ig',
				'Twitter': 'x',
				'Newsletter': '📧'
			};
			return map[platform] || platform;
		}

		function showDetails(day, posts) {
			const panel = document.getElementById('detailsPanel');
			const dateStr = `${day} de ${months[currentMonth]}`;
			document.getElementById('panelDate').textContent = dateStr;

			const postsList = document.getElementById('postsList');
			postsList.innerHTML = posts.map(post => `
				<div class="post-item" ${post.isCustom ? 'style="border-left-color: #10b981; background: rgba(16, 185, 129, 0.08);"' : ''}>
					<div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem;">
						<div class="post-platform">${post.platform}</div>
						${post.isCustom ? '<div style="background: #10b981; color: white; padding: 0.2rem 0.5rem; border-radius: 3px; font-size: 0.7rem; font-weight: 600;">NUEVO</div>' : ''}
					</div>
					<div class="post-time">${post.time || '9:00 AM'}</div>
					<div class="post-title">${post.title || 'Sin título'}</div>
					<div class="post-pillar">${post.pillar || 'General'}</div>
					${post.description ? `<div style="color: var(--gray); font-size: 0.85rem; margin-top: 0.5rem;">${post.description}</div>` : ''}
				</div>
			`).join('');

			panel.classList.add('active');
			panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
		}

		function closeDetails() {
			document.getElementById('detailsPanel').classList.remove('active');
		}

		function previousMonth() {
			currentMonth = (currentMonth - 1 + 3) % 3;
			renderCalendar();
		}

		function nextMonth() {
			currentMonth = (currentMonth + 1) % 3;
			renderCalendar();
		}

		function updateMonthTitle() {
			document.getElementById('monthTitle').textContent = `${months[currentMonth]} 2025`;
		}

		function refreshCalendar() {
			loadCustomPosts();
			renderCalendar();
			updateStats();
		}

		function updateStats() {
			let totalPosts = 0;
			let totalBlogs = 0;
			const platforms = new Set();

			// Count posts from calendar.json
			calendarData.weeks?.forEach(week => {
				week.posts?.forEach(post => {
					totalPosts++;
					if (post.type === 'blog') totalBlogs++;
					if (post.platform) platforms.add(post.platform);
				});
				week.blogs?.forEach(() => totalBlogs++);
			});

			// Count posts from Content Manager
			customPosts.forEach(post => {
				totalPosts++;
				if (post.platform) platforms.add(post.platform);
			});

			document.getElementById('totalPosts').textContent = totalPosts;
			document.getElementById('totalBlogs').textContent = totalBlogs;
			document.getElementById('platformCount').textContent = platforms.size;
			document.getElementById('postsPerWeek').textContent = (totalPosts / 13).toFixed(1);
		}

		loadCalendar();
	</script>
</body>
</html>

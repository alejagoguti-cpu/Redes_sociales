<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calendario Interactivo - Bitaxus CM</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap">
	<style>
		:root {
			--coral: #ef5b59;
			--ink: #242735;
			--muted: #8b8f9b;
			--line: #f0f1f3;
			--canvas: #f5f6f8;
			--surface: #ffffff;
			--shadow: 0 7px 24px rgba(32, 40, 55, 0.055);
		}

		* { margin: 0; padding: 0; box-sizing: border-box; }

		body {
			font-family: 'DM Sans', system-ui, sans-serif;
			background: var(--canvas);
			color: var(--ink);
			padding: 2.5rem;
		}

		h1, h2, b, strong {
			font-family: 'Manrope', system-ui, sans-serif;
			letter-spacing: -0.025em;
		}

		.container { max-width: 1100px; margin: 0 auto; }

		header { margin-bottom: 3rem; }

		h1 {
			font-size: 2.2rem;
			font-weight: 800;
			margin-bottom: 0.5rem;
		}

		.subtitle {
			color: var(--muted);
			font-size: 1rem;
			font-weight: 400;
		}

		.calendar-controls {
			display: flex;
			gap: 1.5rem;
			margin-bottom: 2.5rem;
			justify-content: space-between;
			align-items: center;
			flex-wrap: wrap;
		}

		.month-nav {
			display: flex;
			gap: 0.75rem;
			align-items: center;
		}

		button {
			background: var(--surface);
			border: 1px solid var(--line);
			color: var(--ink);
			padding: 0.85rem 1.5rem;
			border-radius: 9px;
			cursor: pointer;
			font-family: 'Manrope', system-ui, sans-serif;
			font-weight: 600;
			transition: all 0.18s cubic-bezier(0.23, 1, 0.32, 1);
			font-size: 0.95rem;
			box-shadow: var(--shadow);
		}

		button:hover {
			border-color: #d9b3b1;
			background: #faf9f8;
			box-shadow: 0 8px 20px rgba(32, 40, 55, 0.08);
		}

		.month-title {
			font-size: 1.25rem;
			font-weight: 700;
			min-width: 160px;
			text-align: center;
		}

		.calendar {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 14px;
			padding: 2.5rem;
			margin-bottom: 2.5rem;
			box-shadow: var(--shadow);
		}

		.weekdays {
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			gap: 1rem;
			margin-bottom: 1.5rem;
		}

		.weekday-header {
			text-align: center;
			font-weight: 700;
			color: var(--muted);
			font-size: 0.85rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			padding: 0.75rem;
		}

		.days {
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			gap: 1rem;
		}

		.day {
			aspect-ratio: 1;
			border: 1.5px solid var(--line);
			border-radius: 10px;
			padding: 0.85rem;
			cursor: pointer;
			transition: all 0.18s cubic-bezier(0.23, 1, 0.32, 1);
			display: flex;
			flex-direction: column;
			position: relative;
			min-height: 85px;
			background: var(--surface);
		}

		.day:hover {
			border-color: #d9b3b1;
			background: #faf9f8;
			box-shadow: 0 8px 20px rgba(32, 40, 55, 0.08);
			transform: translateY(-2px);
		}

		.day.other-month {
			opacity: 0.25;
			cursor: default;
		}

		.day.other-month:hover {
			border-color: var(--line);
			background: var(--surface);
			box-shadow: none;
			transform: none;
		}

		.day.has-posts {
			border-color: var(--coral);
			background: rgba(239, 91, 89, 0.08);
			box-shadow: inset 0 0 15px rgba(239, 91, 89, 0.08);
		}

		.day.has-posts:hover {
			box-shadow: 0 8px 20px rgba(239, 91, 89, 0.15), inset 0 0 15px rgba(239, 91, 89, 0.08);
		}

		.day-number {
			font-weight: 800;
			font-size: 1rem;
			margin-bottom: 0.6rem;
			letter-spacing: -0.01em;
		}

		.post-count {
			font-size: 0.7rem;
			background: linear-gradient(135deg, var(--coral), #e84c50);
			color: white;
			padding: 0.3rem 0.5rem;
			border-radius: 4px;
			display: inline-block;
			font-weight: 700;
			letter-spacing: 0.02em;
			box-shadow: 0 2px 6px rgba(239, 91, 89, 0.2);
		}

		.stats {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 1.5rem;
			margin-bottom: 3.5rem;
		}

		.stat-card {
			background: var(--surface);
			border: 1px solid var(--line);
			padding: 1.75rem;
			border-radius: 10px;
			text-align: center;
			box-shadow: var(--shadow);
			transition: all 0.18s ease;
		}

		.stat-card:hover {
			border-color: #d9b3b1;
			box-shadow: 0 10px 26px rgba(32, 40, 55, 0.08);
		}

		.stat-value {
			font-size: 2.2rem;
			font-weight: 800;
			color: var(--coral);
			letter-spacing: -0.02em;
		}

		.stat-label {
			color: var(--muted);
			font-size: 0.85rem;
			margin-top: 0.75rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			font-weight: 600;
		}

		.details-panel {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 14px;
			padding: 2.5rem;
			display: none;
			animation: slideIn 0.35s cubic-bezier(0.23, 1, 0.32, 1);
			box-shadow: var(--shadow);
		}

		.details-panel.active {
			display: block;
		}

		@keyframes slideIn {
			from { opacity: 0; transform: translateY(15px); }
			to { opacity: 1; transform: translateY(0); }
		}

		.panel-title {
			font-size: 1.3rem;
			font-weight: 700;
			margin-bottom: 1.75rem;
			display: flex;
			align-items: center;
			gap: 0.75rem;
		}

		.close-btn {
			margin-left: auto;
			background: var(--canvas);
			border: 1px solid var(--line);
			width: 36px;
			height: 36px;
			border-radius: 8px;
			cursor: pointer;
			font-size: 1.2rem;
			transition: all 0.18s ease;
		}

		.close-btn:hover {
			background: rgba(239, 91, 89, 0.08);
			border-color: var(--coral);
		}

		.posts-list {
			display: flex;
			flex-direction: column;
			gap: 1.5rem;
		}

		.post-item {
			border-left: 3px solid var(--coral);
			padding: 1.25rem;
			background: #faf9f8;
			border-radius: 8px;
			transition: all 0.18s ease;
		}

		.post-item:hover {
			background: rgba(239, 91, 89, 0.05);
			box-shadow: 0 2px 8px rgba(32, 40, 55, 0.06);
		}

		.post-platform {
			display: inline-block;
			background: linear-gradient(135deg, var(--coral), #e84c50);
			color: white;
			padding: 0.35rem 0.85rem;
			border-radius: 6px;
			font-size: 0.8rem;
			font-weight: 700;
			margin-bottom: 0.75rem;
			letter-spacing: 0.02em;
			box-shadow: 0 2px 6px rgba(239, 91, 89, 0.2);
		}

		.post-time {
			color: var(--muted);
			font-size: 0.9rem;
			margin-bottom: 0.75rem;
			font-weight: 500;
		}

		.post-title {
			font-weight: 700;
			margin-bottom: 0.75rem;
		}

		.post-pillar {
			display: inline-block;
			background: rgba(239, 91, 89, 0.1);
			padding: 0.35rem 0.85rem;
			border-radius: 6px;
			font-size: 0.75rem;
			color: var(--muted);
			font-weight: 600;
			border: 0.5px solid rgba(239, 91, 89, 0.15);
		}

		@media (max-width: 1000px) {
			.features { padding: 3.5rem 2rem; }
		}

		@media (max-width: 768px) {
			body { padding: 1.5rem; }
			h1 { font-size: 1.8rem; }
			.day { min-height: 70px; padding: 0.5rem; }
			.weekdays, .days { gap: 0.75rem; }
		}
	</style>
</head>
<body>
	<div class="container">
		<header>
			<h1>Calendario Interactivo</h1>
			<p class="subtitle">Visualiza tus posts programados en Q1 2025</p>
		</header>

		<div class="stats" id="stats"></div>

		<div class="calendar-controls">
			<div class="month-nav">
				<button onclick="previousMonth()">← Anterior</button>
				<div class="month-title" id="monthTitle">Enero 2025</div>
				<button onclick="nextMonth()">Siguiente →</button>
			</div>
			<button onclick="refreshCalendar()">🔄 Refrescar</button>
		</div>

		<div class="calendar">
			<div class="weekdays">
				<div class="weekday-header">Lun</div>
				<div class="weekday-header">Mar</div>
				<div class="weekday-header">Mié</div>
				<div class="weekday-header">Jue</div>
				<div class="weekday-header">Vie</div>
				<div class="weekday-header">Sáb</div>
				<div class="weekday-header">Dom</div>
			</div>
			<div class="days" id="calendarDays"></div>
		</div>

		<div class="details-panel" id="detailsPanel">
			<div class="panel-title">
				Posts del <span id="selectedDate"></span>
				<button class="close-btn" onclick="closePanel()">×</button>
			</div>
			<div class="posts-list" id="postsList"></div>
		</div>
	</div>

	<script>
		let currentMonth = 0;
		const months = ['Enero', 'Febrero', 'Marzo'];
		
		function renderCalendar() {
			const year = 2025;
			const month = currentMonth;
			const firstDay = new Date(year, month, 1);
			const lastDay = new Date(year, month + 1, 0);
			const prevLastDay = new Date(year, month, 0);
			
			const daysInMonth = lastDay.getDate();
			const daysInPrevMonth = prevLastDay.getDate();
			const dayOfWeek = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
			
			document.getElementById('monthTitle').textContent = `${months[month]} ${year}`;
			
			let html = '';
			
			// Días del mes anterior
			for (let i = dayOfWeek - 1; i >= 0; i--) {
				html += `<div class="day other-month"><div class="day-number">${daysInPrevMonth - i}</div></div>`;
			}
			
			// Días del mes actual
			for (let i = 1; i <= daysInMonth; i++) {
				const dateStr = `2025-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
				const posts = getPostsForDate(dateStr);
				const hasClass = posts.length > 0 ? 'has-posts' : '';
				html += `<div class="day ${hasClass}" onclick="showDetails('${dateStr}')">
					<div class="day-number">${i}</div>
					${posts.length > 0 ? `<div class="post-count">${posts.length}</div>` : ''}
				</div>`;
			}
			
			// Días del siguiente mes
			const totalCells = dayOfWeek + daysInMonth;
			const remainingCells = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
			for (let i = 1; i <= remainingCells; i++) {
				html += `<div class="day other-month"><div class="day-number">${i}</div></div>`;
			}
			
			document.getElementById('calendarDays').innerHTML = html;
			updateStats();
		}

		function getPostsForDate(dateStr) {
			const posts = JSON.parse(localStorage.getItem('bitaxusPosts')) || [];
			return posts.filter(p => p.date === dateStr);
		}

		function showDetails(dateStr) {
			const posts = getPostsForDate(dateStr);
			if (posts.length === 0) return;
			
			const date = new Date(dateStr + 'T00:00:00');
			const formattedDate = new Intl.DateTimeFormat('es-ES', {
				weekday: 'long',
				day: 'numeric',
				month: 'long'
			}).format(date);
			
			document.getElementById('selectedDate').textContent = formattedDate;
			
			let postsHtml = posts.map(post => `
				<div class="post-item">
					<div class="post-platform">${post.platform}</div>
					<div class="post-time">🕐 ${post.time}</div>
					<div class="post-title">${post.title}</div>
					<div class="post-pillar">${post.pillar}</div>
					${post.description ? `<p style="margin-top: 0.75rem; color: var(--muted); font-size: 0.9rem;">${post.description}</p>` : ''}
				</div>
			`).join('');
			
			document.getElementById('postsList').innerHTML = postsHtml;
			document.getElementById('detailsPanel').classList.add('active');
		}

		function closePanel() {
			document.getElementById('detailsPanel').classList.remove('active');
		}

		function updateStats() {
			const posts = JSON.parse(localStorage.getItem('bitaxusPosts')) || [];
			const platforms = new Set(posts.map(p => p.platform));
			
			const statsHtml = `
				<div class="stat-card">
					<div class="stat-value">${posts.length}</div>
					<div class="stat-label">Posts Total</div>
				</div>
				<div class="stat-card">
					<div class="stat-value">${platforms.size}</div>
					<div class="stat-label">Plataformas</div>
				</div>
				<div class="stat-card">
					<div class="stat-value">${Math.ceil(posts.length / 4)}</div>
					<div class="stat-label">Por Semana</div>
				</div>
			`;
			
			document.getElementById('stats').innerHTML = statsHtml;
		}

		function previousMonth() {
			if (currentMonth > 0) {
				currentMonth--;
				renderCalendar();
			}
		}

		function nextMonth() {
			if (currentMonth < 2) {
				currentMonth++;
				renderCalendar();
			}
		}

		function refreshCalendar() {
			renderCalendar();
		}

		renderCalendar();

		window.addEventListener('storage', () => {
			renderCalendar();
		});
	</script>
</body>
</html>

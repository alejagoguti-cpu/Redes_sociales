<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bitaxus - Planeación Mensual</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
	<style>
		:root {
			--red: #D1232E;
			--dark: #0A0A1A;
			--card: #1A1A2E;
			--border: #2D2D44;
			--text: #E5E5E5;
			--gray: #999999;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Inter', system-ui;
			background: var(--dark);
			color: var(--text);
			padding: 2rem;
		}

		.container {
			max-width: 1400px;
			margin: 0 auto;
		}

		header {
			margin-bottom: 2rem;
		}

		h1 {
			font-size: 2rem;
			margin-bottom: 0.5rem;
		}

		.subtitle {
			color: var(--gray);
			font-size: 1rem;
		}

		.controls {
			display: flex;
			gap: 1rem;
			margin-bottom: 2rem;
			flex-wrap: wrap;
		}

		select, button {
			padding: 0.75rem 1.25rem;
			background: var(--card);
			border: 1px solid var(--border);
			color: var(--text);
			border-radius: 6px;
			font-family: inherit;
			cursor: pointer;
			transition: all 0.2s;
		}

		button {
			background: var(--red);
			color: white;
			border: none;
		}

		button:hover {
			background: #B81C28;
		}

		select:focus, button:focus {
			outline: none;
			border-color: var(--red);
		}

		.month-view {
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			gap: 0.75rem;
			margin-bottom: 2rem;
		}

		.day-header {
			background: rgba(209, 35, 46, 0.1);
			padding: 0.75rem;
			text-align: center;
			font-weight: 600;
			color: var(--red);
			border-radius: 6px;
			font-size: 0.9rem;
		}

		.day {
			background: var(--card);
			border: 1px solid var(--border);
			padding: 0.75rem;
			border-radius: 6px;
			min-height: 100px;
			position: relative;
			transition: all 0.2s;
		}

		.day:hover {
			border-color: var(--red);
			box-shadow: 0 4px 12px rgba(209, 35, 46, 0.15);
		}

		.day-number {
			font-weight: 600;
			font-size: 1.1rem;
			margin-bottom: 0.5rem;
			color: var(--red);
		}

		.day-empty {
			opacity: 0.3;
		}

		.post {
			font-size: 0.75rem;
			padding: 0.4rem;
			margin-bottom: 0.35rem;
			background: rgba(209, 35, 46, 0.2);
			border-left: 2px solid var(--red);
			border-radius: 2px;
			cursor: pointer;
			transition: all 0.2s;
		}

		.post:hover {
			background: rgba(209, 35, 46, 0.35);
		}

		.platform {
			display: inline-block;
			font-size: 0.65rem;
			font-weight: 600;
			text-transform: uppercase;
			color: var(--red);
			margin-right: 0.25rem;
		}

		.week-grid {
			margin-bottom: 2rem;
		}

		.week-header {
			background: rgba(209, 35, 46, 0.1);
			padding: 1rem;
			border-radius: 6px;
			margin-bottom: 1rem;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.week-title {
			font-weight: 600;
			font-size: 1.1rem;
		}

		.week-stats {
			font-size: 0.85rem;
			color: var(--gray);
		}

		.week-table {
			width: 100%;
			border-collapse: collapse;
			margin-bottom: 1rem;
		}

		.week-table th {
			background: rgba(209, 35, 46, 0.1);
			padding: 0.75rem;
			text-align: left;
			font-weight: 600;
			color: var(--red);
			font-size: 0.9rem;
			border: 1px solid var(--border);
		}

		.week-table td {
			padding: 0.75rem;
			border: 1px solid var(--border);
			font-size: 0.9rem;
		}

		.week-table tr:hover {
			background: rgba(209, 35, 46, 0.05);
		}

		.plat-ln { color: #0077B5; }
		.plat-ig { color: #E52D8E; }
		.plat-tw { color: #1FA0E0; }

		.pillar-badge {
			display: inline-block;
			padding: 0.25rem 0.5rem;
			background: rgba(209, 35, 46, 0.15);
			border-radius: 3px;
			font-size: 0.75rem;
			color: var(--red);
		}

		.summary {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 1rem;
			margin-bottom: 2rem;
		}

		.stat {
			background: var(--card);
			border: 1px solid var(--border);
			padding: 1.5rem;
			border-radius: 8px;
			text-align: center;
		}

		.stat-value {
			font-size: 2rem;
			font-weight: 700;
			color: var(--red);
			line-height: 1;
		}

		.stat-label {
			font-size: 0.85rem;
			color: var(--gray);
			text-transform: uppercase;
			margin-top: 0.5rem;
			letter-spacing: 0.05em;
		}

		.modal {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, 0.8);
			z-index: 1000;
			align-items: center;
			justify-content: center;
		}

		.modal.active {
			display: flex;
		}

		.modal-content {
			background: var(--card);
			border: 1px solid var(--border);
			padding: 2rem;
			border-radius: 8px;
			max-width: 600px;
			max-height: 80vh;
			overflow-y: auto;
		}

		.modal-close {
			float: right;
			font-size: 1.5rem;
			cursor: pointer;
			color: var(--gray);
		}

		.modal-close:hover {
			color: var(--red);
		}

		.btn-print {
			background: var(--card);
			border: 1px solid var(--border);
			color: var(--text);
		}

		.btn-print:hover {
			border-color: var(--red);
		}

		@media print {
			body { padding: 0; }
			.controls { display: none; }
		}

		@media (max-width: 768px) {
			.month-view {
				grid-template-columns: repeat(7, 1fr);
				gap: 0.5rem;
			}

			.day {
				padding: 0.5rem;
				min-height: auto;
			}

			.post {
				font-size: 0.65rem;
				padding: 0.3rem;
			}

			.week-table {
				font-size: 0.8rem;
			}

			.week-table th,
			.week-table td {
				padding: 0.5rem;
			}
		}
	</style>

		let currentView = 'calendar';

		function loadMonth() {
			const month = document.getElementById('monthSelect').value;
			const data = calendar[month];
			updateSummary(data);
			if (currentView === 'calendar') {
				renderCalendar(data);
			} else {
				renderWeekly(data);
			}
		}

		function updateSummary(data) {
			const html = `
				<div class="stat">
					<div class="stat-value">${data.totalPosts}</div>
					<div class="stat-label">Posts Mes</div>
				</div>
				<div class="stat">
					<div class="stat-value">${Math.ceil(data.totalPosts / 3)}</div>
					<div class="stat-label">Posts Semana</div>
				</div>
				<div class="stat">
					<div class="stat-value">${data.totalBlogs}</div>
					<div class="stat-label">Blogs</div>
				</div>
				<div class="stat">
					<div class="stat-value">3</div>
					<div class="stat-label">Plataformas</div>
				</div>
			`;
			document.getElementById('summary').innerHTML = html;
		}

		function renderCalendar(data) {
			let html = '<h2 style="margin-bottom: 1rem; font-size: 1.3rem;">' + data.name + '</h2>';

			data.weeks.forEach(week => {
				html += `
					<div style="margin-bottom: 2rem;">
						<div class="week-header">
							<div class="week-title">Semana ${week.week}: ${week.start} → ${week.end}</div>
							<div class="week-stats">${week.posts.length} posts${week.blog ? ' + 1 blog' : ''}</div>
						</div>
						<table class="week-table">
							<thead>
								<tr>
									<th>Fecha</th>
									<th>Plataforma</th>
									<th>Hora</th>
									<th>Tema (Pilar)</th>
									<th>Contenido</th>
								</tr>
							</thead>
							<tbody>
				`;

				week.posts.forEach(post => {
					const platClass = post.platform === 'LN' ? 'plat-ln' : post.platform === 'IG' ? 'plat-ig' : 'plat-tw';
					const platName = post.platform === 'LN' ? 'LinkedIn' : post.platform === 'IG' ? 'Instagram' : 'Twitter';
					html += `
						<tr onclick="showDetail('${post.title}', '${post.platform}', '${post.time}', '${post.pillar}', '${post.content}')">
							<td>${post.date} ${post.day}</td>
							<td><span class="${platClass}" style="font-weight: 600;">${platName}</span></td>
							<td><strong>${post.time}</strong></td>
							<td><span class="pillar-badge">${post.pillar}</span></td>
							<td>${post.title}</td>
						</tr>
					`;
				});

				if (week.blog) {
					html += `
						<tr style="background: rgba(209, 35, 46, 0.1);">
							<td>${week.blog.date}</td>
							<td colspan="4"><strong>📝 BLOG:</strong> ${week.blog.title}</td>
						</tr>
					`;
				}

				html += `
							</tbody>
						</table>
					</div>
				`;
			});

			document.getElementById('calendarView').innerHTML = html;
			document.getElementById('weeklyView').style.display = 'none';
			document.getElementById('calendarView').style.display = 'block';
		}

		function renderWeekly(data) {
			let html = '<h2 style="margin-bottom: 1rem; font-size: 1.3rem;">' + data.name + ' (Vista Semanal)</h2>';

			data.weeks.forEach(week => {
				html += `<div class="month-view">`;
				const days = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
				days.forEach(day => html += `<div class="day-header">${day}</div>`);

				// Llenar días vacíos al inicio
				const firstDayOfWeek = 0; // Asumimos lunes
				for (let i = 0; i < firstDayOfWeek; i++) {
					html += '<div class="day day-empty"></div>';
				}

				// Llenar días con posts
				for (let i = 1; i <= 31; i++) {
					const post = week.posts.find(p => p.date === i);
					if (post) {
						html += `
							<div class="day">
								<div class="day-number">${i}</div>
								<div class="post" onclick="showDetail('${post.title}', '${post.platform}', '${post.time}', '${post.pillar}', '${post.content}')">
									<span class="platform">${post.platform}</span> ${post.time}
								</div>
							</div>
						`;
					} else if (i <= 31) {
						html += '<div class="day day-empty"><div class="day-number">' + i + '</div></div>';
					}
				}

				html += '</div>';
			});

			document.getElementById('weeklyView').innerHTML = html;
			document.getElementById('calendarView').style.display = 'none';
			document.getElementById('weeklyView').style.display = 'block';
		}

		function toggleView() {
			currentView = currentView === 'calendar' ? 'weekly' : 'calendar';
			loadMonth();
		}

		function showDetail(title, platform, time, pillar, content) {
			const platName = platform === 'LN' ? 'LinkedIn' : platform === 'IG' ? 'Instagram' : 'Twitter';
			const html = `
				<h2>${title}</h2>
				<div style="margin-top: 1.5rem;">
					<div style="margin-bottom: 1rem;">
						<div><strong>Plataforma:</strong> ${platName}</div>
						<div><strong>Hora:</strong> ${time}</div>
						<div><strong>Pilar:</strong> <span class="pillar-badge">${pillar}</span></div>
					</div>
					<div style="background: rgba(209, 35, 46, 0.1); padding: 1rem; border-radius: 6px; margin-top: 1rem;">
						<strong>Contenido:</strong>
						<p style="margin-top: 0.5rem; color: var(--gray);">${content}</p>
					</div>
				</div>
				<button style="margin-top: 1.5rem; width: 100%;" onclick="closeModal()">Cerrar</button>
			`;
			document.getElementById('modalBody').innerHTML = html;
			document.getElementById('modal').classList.add('active');
		}

		function closeModal() {
			document.getElementById('modal').classList.remove('active');
		}

			async function syncPlanningFromSupabase() {
				try {
					const remotePosts = await bitaxusData.loadPosts();
					if (remotePosts.length) {
						const weeks = new Map();
						remotePosts.forEach((post) => {
							const date = new Date(`${post.scheduled_date}T12:00:00Z`);
							const dayNumber = date.getUTCDate();
							const weekNumber = Math.ceil(dayNumber / 7);
							if (!weeks.has(weekNumber)) weeks.set(weekNumber, { week: weekNumber, start: '', end: '', posts: [], blog: null });
							const day = new Intl.DateTimeFormat('es-CO', { weekday: 'long', timeZone: 'UTC' }).format(date);
							const platform = post.platform === 'LinkedIn' ? 'LN' : post.platform === 'Instagram' ? 'IG' : 'TW';
							weeks.get(weekNumber).posts.push({
								date: dayNumber,
								day: day.charAt(0).toUpperCase() + day.slice(1),
								platform,
								time: (post.scheduled_time || '09:00').slice(0, 5),
								pillar: post.pillar || 'General',
								title: post.title,
								content: post.description || ''
							});
						});
						calendar.january.weeks = Array.from(weeks.values()).sort((a, b) => a.week - b.week);
						calendar.january.totalPosts = remotePosts.length;
					}
					bitaxusData.setConnectionStatus('Calendario sincronizado con Supabase', 'success');
				} catch (error) {
					bitaxusData.setConnectionStatus('Calendario local · Supabase pendiente', 'warning');
					console.warn('No se pudo leer el calendario remoto:', error.message);
				}
				loadMonth();
			}

			// Load on start
			syncPlanningFromSupabase();
	</script>

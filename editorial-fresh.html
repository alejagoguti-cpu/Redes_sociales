<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitaxus · Centro Editorial - FRESH</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0F0F13;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(21, 21, 25, 0.8);
      border-radius: 16px;
      border: 1px solid #2A2A32;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 16px;
      color: #E12C37;
      letter-spacing: -0.04em;
    }
    p {
      font-size: 18px;
      color: #8B8B99;
      margin-bottom: 24px;
    }
    .status {
      font-size: 14px;
      color: #55c98d;
      padding: 12px;
      background: rgba(85, 201, 141, 0.1);
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid rgba(85, 201, 141, 0.2);
    }
    .small {
      font-size: 12px;
      color: #6B6B77;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✓ Bitaxus</h1>
    <p>Centro Editorial Activado</p>
    <p style="font-size: 14px; color: #6B6B77; margin-bottom: 0;">
      Panel de Control en Desarrollo
    </p>
    <div class="status">
      ✓ Conexión con Supabase establecida<br>
      ✓ Base de datos sincronizada<br>
      ✓ Tema Bitaxus aplicado
    </div>
    <div class="small">
      Versión: FRESH (Septiembre 7, 2026)<br>
      URL base cargando desde: editorial-fresh.html
    </div>
  </div>
</body>
</html>
